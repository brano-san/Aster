[package]
name = "aster-ssh"
description = "SSH support for Aster: ~/.ssh/config parsing and a native client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aster-proto.workspace = true
crossbeam-channel.workspace = true
russh = { workspace = true, features = ["ring", "rsa", "flate2"] }
russh-sftp.workspace = true
tokio = { workspace = true, features = ["rt", "net", "process", "io-util", "time", "sync", "macros", "fs"] }
tracing.workspace = true
