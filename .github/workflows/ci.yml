name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          cargo build --profile dist -p aster
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} does not match the workspace version $version" }
          New-Item -ItemType Directory -Force target/packages | Out-Null
          Compress-Archive -Path target/dist/aster.exe, LICENSE, README.md -DestinationPath "target/packages/aster-$version-x86_64-windows.zip"
          Copy-Item target/dist/aster.exe "target/packages/aster-$version-x86_64-windows-setup.exe"
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: aster-windows
          path: |
            target/packages/*.zip
            target/packages/*-setup.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0 libgles2 libgl1-mesa-dri libxkbcommon-x11-0 fonts-dejavu-core
      - run: cargo build --workspace --release
      - run: cargo test --workspace
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cargo build --profile dist -p aster
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version"
            exit 1
          fi
          name="aster-$version-x86_64-linux"
          package="target/packages/$name"
          mkdir -p "$package/share/applications" "$package/share/icons/hicolor/128x128/apps"
          cp target/dist/aster LICENSE README.md "$package/"
          cp assets/linux/aster.desktop "$package/share/applications/"
          cp -R assets/linux/hicolor/. "$package/share/icons/hicolor/"
          cp assets/aster-128.png "$package/share/icons/hicolor/128x128/apps/aster.png"
          tar -C target/packages -czf "target/packages/$name.tar.gz" "$name"
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: aster-linux
          path: target/packages/*.tar.gz
          if-no-files-found: error

  deps-isolation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          status=0
          for crate in aster-gfx aster-vt aster-core aster-platform; do
            tree=$(cargo tree -p "$crate" -e normal,build --target all --prefix none)
            if grep -E '^windows(-core)? v' <<< "$tree"; then
              echo "::error::$crate depends on the windows crate"
              status=1
            else
              echo "$crate: no windows crate"
            fi
          done
          exit "$status"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, deps-isolation]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          pattern: aster-*
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" *.zip *.tar.gz *-setup.exe --clobber
          elif [ -f "docs/releases/${GITHUB_REF_NAME#v}.md" ]; then
            gh release create "$GITHUB_REF_NAME" *.zip *.tar.gz *-setup.exe --title "Aster ${GITHUB_REF_NAME#v}" --notes-file "docs/releases/${GITHUB_REF_NAME#v}.md"
          else
            gh release create "$GITHUB_REF_NAME" *.zip *.tar.gz *-setup.exe --title "Aster ${GITHUB_REF_NAME#v}" --generate-notes
          fi
      - uses: dtolnay/rust-toolchain@stable
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ASTER_UPDATE_KEY: ${{ secrets.ASTER_UPDATE_KEY }}
        run: |
          if [ -z "$ASTER_UPDATE_KEY" ]; then
            echo "::notice::No ASTER_UPDATE_KEY: archives are not signed and latest.json is not published"
            exit 0
          fi
          gh release view "$GITHUB_REF_NAME" --json body --jq .body > notes.txt
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.draft == false and .prerelease == false) | {version: .tag_name, notes: .body}' > history.jsonl
          cargo run --quiet -p aster-sign -- manifest "${GITHUB_REF_NAME#v}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "https://github.com/$GH_REPO/releases/download/$GITHUB_REF_NAME" notes.txt *.zip *.tar.gz > manifest.json
          jq --slurpfile history history.jsonl --arg tag "$GITHUB_REF_NAME" '.history = ($history | map(select(.version != $tag)))' manifest.json > latest.json
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber
